name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # HACS and hassfest change their rules, and pymodbus its releases, without
    # a commit here, so everything runs again every Monday.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  ruff:
    runs-on: ubuntu-latest
    env:
      # Pinned, and raised by hand: a new ruff release brings new rules, and
      # the run should go red over a change in this repository, not over one
      # in ruff. The rules themselves are in ruff.toml.
      RUFF_VERSION: "0.16.6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "ruff==${RUFF_VERSION}"
      - run: ruff check --output-format=github .

  tests:
    name: tests (Python ${{ matrix.python }}, pymodbus ${{ matrix.pymodbus }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both houses run the integration on 3.14, the Python Home Assistant
        # has required since 2026.3; 3.13 is what the oldest release hacs.json
        # admits was built for (R60).
        python: ["3.13", "3.14"]
        # The adapter is run against the floor the manifest allows, the version
        # Home Assistant's own modbus integration ships, and whatever PyPI has
        # today. The last leg is deliberately unpinned, past the manifest's own
        # cap, so the weekly run meets a new major before a user does. It may
        # not block a push or a pull request over something the manifest
        # already keeps out, but it must be allowed to fail the scheduled run
        # and a run started by hand: a job that may fail leaves the run green,
        # and GitHub notifies nobody about a green run, so the early warning
        # would otherwise be seen only by someone who happens to open the
        # Actions tab. A red Monday run is the warning, and it goes to whoever
        # last touched this file.
        pymodbus: ["3.6.9", "3.13.1", "latest"]
        # Five of the six pairs. The manifest's floor is what an older Home
        # Assistant on 3.13 may still hold, and no Home Assistant on 3.14
        # comes with it: that pair could only go red over an installation
        # nobody has, so it is left out rather than run.
        exclude:
          - python: "3.14"
            pymodbus: "3.6.9"
    continue-on-error: ${{ matrix.pymodbus == 'latest' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-test.txt
      - if: ${{ matrix.pymodbus != 'latest' }}
        run: pip install "pymodbus==${{ matrix.pymodbus }}"
      - if: ${{ matrix.pymodbus == 'latest' }}
        run: pip install --upgrade pymodbus
      - run: python -c "import pymodbus; print(pymodbus.__version__)"
      - run: pytest -q
