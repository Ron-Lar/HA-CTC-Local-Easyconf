name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # HACS and hassfest change their rules, and pymodbus and Home Assistant
    # their releases, without a commit here, so everything runs again every
    # Monday.
    - cron: "0 4 * * 1"
  workflow_dispatch:
  # release.yml runs all of this on the tagged commit before it makes a
  # release. A called workflow sees its caller's event, the tag's push, so
  # the jobs run as on a push to main: the latest legs may fail, and the
  # newest release's smoke test is left to Monday.
  workflow_call:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  ruff:
    runs-on: ubuntu-latest
    env:
      # Pinned, and raised by hand: a new ruff release brings new rules, and
      # the run should go red over a change in this repository, not over one
      # in ruff. The rules themselves are in ruff.toml.
      RUFF_VERSION: "0.16.6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "ruff==${RUFF_VERSION}"
      - run: ruff check --output-format=github .

  tests:
    name: tests (Python ${{ matrix.python }}, pymodbus ${{ matrix.pymodbus }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both houses run the integration on 3.14, the Python Home Assistant
        # has required since 2026.3 and so the only one the floor in hacs.json
        # admits (R56). 3.13, the Python of the releases before 2026.3, stays
        # in the matrix so that lowering the floor below 2026.3 is not also
        # the first run on 3.13 (R60).
        python: ["3.13", "3.14"]
        # Home Assistant installs an integration's requirements under its own
        # package_constraints.txt, so a user runs the pymodbus pinned there,
        # whatever range the manifest allows. The pinned legs follow that pin
        # in two releases: the floor in hacs.json (3.11.2 in 2026.5.0, the
        # pair under include) and the houses' release (3.13.1 in 2026.9.4).
        # When the floor or the houses' release is raised, look up the new
        # release's pin and follow it here. 3.6.9 is the manifest's own floor,
        # run so that the range it states is not only a promise.
        # The last leg is deliberately unpinned, past the manifest's own
        # cap, so the weekly run meets a new major before a user does. It may
        # not block a push or a pull request over something the manifest
        # already keeps out, but it must be allowed to fail the scheduled run
        # and a run started by hand: a job that may fail leaves the run green,
        # and GitHub notifies nobody about a green run, so the early warning
        # would otherwise be seen only by someone who happens to open the
        # Actions tab. A red Monday run is the warning, and it goes to whoever
        # last touched this file.
        pymodbus: ["3.6.9", "3.13.1", "latest"]
        # Five of the six pairs, and the floor's pin as a sixth. No Home
        # Assistant on 3.14 comes with the manifest's floor, so that pair
        # could only go red over an installation nobody has and is left out.
        # The floor's pin runs on 3.14 alone, since 2026.5.0 needs 3.14.2.
        exclude:
          - python: "3.14"
            pymodbus: "3.6.9"
        include:
          - python: "3.14"
            pymodbus: "3.11.2"
    continue-on-error: ${{ matrix.pymodbus == 'latest' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-test.txt
      - if: ${{ matrix.pymodbus != 'latest' }}
        run: pip install "pymodbus==${{ matrix.pymodbus }}"
      - if: ${{ matrix.pymodbus == 'latest' }}
        run: pip install --upgrade pymodbus
      - run: python -c "import pymodbus; print(pymodbus.__version__)"
      - run: pytest -q

  # The suite runs against stand-ins for Home Assistant, so a moved Home
  # Assistant name, a selector config the real selector refuses or a Lovelace
  # class that changed would first show on a house (R58). Under a real release,
  # three ways, scripts/smoke_real_ha.py imports every module, runs every Home
  # Assistant import at every depth, looks up every attribute of a Home
  # Assistant module the source reaches for, and builds the forms that need no
  # network, the CTC page's class and the actions. Methods on objects
  # (hass.config_entries, a ConfigEntry, a selector) and the arguments they
  # take are not seen there.

  smoke-house:
    name: real Home Assistant, the houses' release
    # Pushes and pull requests meet the older of the two releases the houses
    # this is developed on run (2026.10.0 and 2026.9.4). Raised by hand when
    # that house is updated, together with the plugin pin in ha-tests.
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      HA_VERSION: "2026.9.4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Home Assistant with the manifest's own requirements, as it installs
      # the integration.
      - run: >-
          python -c 'import json; print("\n".join(json.load(open("custom_components/ctc_ecozenith/manifest.json"))["requirements"]))'
          | xargs python -m pip install "homeassistant==${HA_VERSION}"
      - run: python scripts/smoke_real_ha.py

  smoke-floor:
    name: real Home Assistant, the floor in hacs.json
    # The release hacs.json promises, read from the file and named nowhere
    # here, on the Python that release was built for. Every run, so a change
    # that starts using a Home Assistant module, function, class or attribute
    # newer than the floor goes red here, wherever in the source it stands;
    # raise hacs.json and add the need to NEEDS in tests/test_ha_floor.py. A
    # method on an object or an argument to one is not seen here and goes
    # into NEEDS by hand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: release
        run: python3 scripts/ha_release.py floor >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.release.outputs.python }}
      - env:
          HA_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          python -c 'import json; print("\n".join(json.load(open("custom_components/ctc_ecozenith/manifest.json"))["requirements"]))'
          | xargs python -m pip install "homeassistant==${HA_VERSION}"
      - run: python scripts/smoke_real_ha.py

  smoke-latest:
    name: real Home Assistant, the newest release, deprecations included
    # Weekly and by hand, the newest release on its own Python, strict: a
    # DeprecationWarning attributed to the integration's modules fails it, and
    # so does Home Assistant's notice in its log that the integration uses
    # something on its way out, which comes about a year before the removal.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: release
        run: python3 scripts/ha_release.py latest >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.release.outputs.python }}
      - env:
          HA_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          python -c 'import json; print("\n".join(json.load(open("custom_components/ctc_ecozenith/manifest.json"))["requirements"]))'
          | xargs python -m pip install "homeassistant==${HA_VERSION}"
      - run: python scripts/smoke_real_ha.py --strict

  ha-tests:
    name: tests under a real Home Assistant core
    # The whole suite where pytest-homeassistant-custom-component is
    # installed, as the README tells a contributor to run it: the Home
    # Assistant tests run against the core the plugin pins, and the rest
    # against the real classes rather than the stand-ins.
    runs-on: ubuntu-latest
    env:
      # 0.13.367 pins Home Assistant 2026.9.4, the release smoke-house runs;
      # the two move together.
      PLUGIN_VERSION: "0.13.367"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The plugin alone: it pins Home Assistant, pytest and pytest-asyncio.
      # Not pymodbus, whose one test drives the real library over a loopback
      # socket that the plugin's socket guard refuses; it runs in tests.
      - run: python -m pip install "pytest-homeassistant-custom-component==${PLUGIN_VERSION}"
      - name: Run the suite and make sure the Home Assistant tests ran
        shell: bash
        run: |
          python -m pytest -q -rs | tee pytest.log
          # Those tests skip themselves, with a reason, where the plugin or
          # its async fixtures cannot run, which here would be a green run
          # that tested nothing this job is for.
          if grep -E "asyncio_mode=auto|could not import 'pytest_homeassistant_custom_component'" pytest.log; then
            echo "::error::the Home Assistant tests skipped themselves"
            exit 1
          fi
