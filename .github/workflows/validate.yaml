name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    # The HACS action fetches hacs.json/manifest through the GitHub API, which
    # fails while this repository is private (HACS cannot install private repos
    # either). Skipped rather than merely non-blocking, so a red X here cannot
    # be mistaken for a real failure. Both lines disappear on their own the day
    # the repo goes public, and then the topics, the brand icon and a release
    # are what is left to do (see beolink/ha-intellipool for the full round).
    if: ${{ !github.event.repository.private }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: tests (pymodbus ${{ matrix.pymodbus }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The adapter is run against the floor the manifest allows, the version
        # Home Assistant's own modbus integration ships, and whatever PyPI has
        # today. The last leg is deliberately unpinned, past the manifest's own
        # cap, so the weekly run meets a new major before a user does. It may
        # not block a push or a pull request over something the manifest
        # already keeps out, but it must be allowed to fail the scheduled run:
        # a job that may fail leaves the run green, and GitHub notifies nobody
        # about a green run, so the early warning would otherwise be seen only
        # by someone who happens to open the Actions tab. A red Monday run is
        # the warning, and it goes to whoever last touched this file.
        pymodbus: ["3.6.9", "3.13.1", "latest"]
    continue-on-error: ${{ matrix.pymodbus == 'latest' && github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt
      - if: ${{ matrix.pymodbus != 'latest' }}
        run: pip install "pymodbus==${{ matrix.pymodbus }}"
      - if: ${{ matrix.pymodbus == 'latest' }}
        run: pip install --upgrade pymodbus
      - run: python -c "import pymodbus; print(pymodbus.__version__)"
      - run: pytest -q
