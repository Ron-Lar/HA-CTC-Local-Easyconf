# HA-Nibe-Easyconf's rules, so a contributor meets one style across these
# integrations (roadmap R57). Where this file goes further than Nibe's, the
# comment at the place says why: the section the test helpers are sorted into,
# the long Swedish lines of explanations.py and const.py, and the dashes the
# tests spell out so as to look for them. CI pins the ruff version in
# .github/workflows/validate.yaml: a new ruff release adds rules, and CI should
# go red over a change in this repository, not over one in ruff.
#
# Python 3.12 is the oldest interpreter the Home Assistant floor in hacs.json
# runs on, so the upgrade rules suggest nothing newer.
target-version = "py312"
line-length = 100
# The tests import their helpers (conftest, ha_stub, fake_pymodbus and the
# fixtures of test_homeassistant) as top-level modules, as pytest puts tests/
# on the path; listed here, the import sorter files them with the repository's
# own code rather than among the third-party packages, in a section of their
# own (see [lint.isort]).
src = [".", "tests"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Home Assistant entity classes set attributes rather than properties.
    "RUF012",
]

[lint.isort]
force-sort-within-sections = true
combine-as-imports = true
# The test helpers come after the third-party packages and before the
# integration's own package: test_homeassistant puts the repository root on the
# path that custom_components is imported from, so a test file run on its own
# finds the integration only when the helper has been imported first.
section-order = [
    "future",
    "standard-library",
    "third-party",
    "test-helpers",
    "first-party",
    "local-folder",
]

[lint.isort.sections]
"test-helpers" = ["conftest", "fake_panel", "fake_pymodbus", "ha_stub", "test_*"]

[lint.per-file-ignores]
# stats.py is a shared file, copied verbatim between these integrations so the
# reporting behaviour stays identical across all of them and a fix in one is a
# straight copy into the others. Linting it here would fork it for cosmetic
# reasons, so its own style is left alone.
"custom_components/*/stats.py" = ["I001", "UP035", "SIM105", "RUF100"]
# The explanations behind every value and the register tables are Swedish
# sentences and one-line table rows: broken to fit a hundred columns they get
# harder to read and to search for, which is the opposite of what the limit is
# for.
"custom_components/*/explanations.py" = ["E501"]
"custom_components/*/const.py" = ["E501"]
# The tests under a real Home Assistant share the fixtures of
# test_homeassistant.py by importing them, and pytest hands each one to a test
# as the parameter of the same name. To pyflakes that parameter redefines the
# import; to pytest it is how the fixture is reached.
"tests/test_homeassistant_*.py" = ["F811"]
# The tests spell out the dash (U+2013) they look for in the Swedish texts so as
# to keep it out of them, and only that is let through here: the package itself
# stays under RUF001, RUF002 and RUF003. RUF001 does not catch an em dash
# (U+2014), so ruff is no guard against that one anywhere.
"tests/*.py" = ["RUF001"]
